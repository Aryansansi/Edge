<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

  <style type="text/tailwindcss">
    :root {
      --font-heading: 'Outfit', sans-serif;
      --font-sans: 'Inter', sans-serif;
      --background: #0b0d10;
      --foreground: #f3f4f6;
      --card: #14171d;
      --border: #242933;
      --primary: #d1ff19;
    }
    
    html {
      font-family: var(--font-sans);
      background: #0b0d10;
      color: #f3f4f6;
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    .edge-app {
      background-image: radial-gradient(circle at 88% 4%, rgba(209,255,25,.045), transparent 22rem), radial-gradient(circle at 4% 46%, rgba(48,69,97,.08), transparent 28rem);
    }

    .font-heading {
      font-family: var(--font-heading);
    }

    .edge-card {
      border: 1px solid #242933;
      border-radius: 1rem;
      background: #14171d;
      padding: 1.5rem;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
    }

    .section-kicker {
      color: #6b7280;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    .nav-link, .nav-link-active {
      position: relative;
      transition: color .2s ease;
      cursor: pointer;
    }
    .nav-link:hover { color: #f3f4f6; }
    .nav-link-active { color: #f3f4f6; }
    .nav-link-active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -21px;
      height: 2px;
      border-radius: 99px;
      background: #d1ff19;
      box-shadow: 0 0 10px rgba(209,255,25,.8);
    }

    .next-action-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid #57611f;
      border-radius: 1rem;
      background: linear-gradient(100deg, rgba(209,255,25,.10), rgba(20,23,29,.95) 47%);
      padding: 1.25rem 1.5rem;
      box-shadow: inset 0 1px rgba(255,255,255,.035);
    }

    .service-icon {
      display: grid;
      height: 2.75rem;
      width: 2.75rem;
      place-items: center;
      border-radius: .75rem;
    }
    .service-icon-lime { color: #d1ff19; background: rgba(209,255,25,.1); }
    .service-icon-blue { color: #83b5ff; background: rgba(97,154,255,.12); }
    .service-icon-orange { color: #f5b766; background: rgba(245,183,102,.1); }

    .status-pill, .plan-badge {
      border-radius: 999px;
      padding: .35rem .55rem;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .status-progress { color: #d1ff19; background: rgba(209,255,25,.1); }
    .status-complete { color: #64dba1; background: rgba(16,185,129,.1); }
    .status-ready { color: #f5b766; background: rgba(245,183,102,.1); }

    .modal-panel {
      border: 1px solid #303641;
      border-radius: 1.5rem;
      background: #14171d;
      padding: 1.5rem;
      box-shadow: 0 24px 100px rgba(0,0,0,.6);
    }

    .plan-option {
      position: relative;
      border: 1px solid #303641;
      border-radius: 1rem;
      background: #101318;
      padding: 1.25rem;
      text-align: left;
      cursor: pointer;
      width: 100%;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .plan-option:hover { border-color: #68732c; transform: translateY(-2px); }
    .plan-option-selected { border-color: #d1ff19; box-shadow: 0 0 0 1px #d1ff19, 0 0 28px rgba(209,255,25,.1); }
    
    .plan-badge { background: #242933; color: #8f96a3; }
    .plan-badge-lime { background: rgba(209,255,25,.13); color: #d1ff19; }

    .plan-radio {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      display: grid;
      height: 1.1rem;
      width: 1.1rem;
      place-items: center;
      border: 1px solid #586170;
      border-radius: 50%;
    }
    .plan-radio-selected { border-color: #d1ff19; }
    .plan-radio-selected span { height: .5rem; width: .5rem; border-radius: 50%; background: #d1ff19; }

    @media (max-width: 639px) {
      .next-action-card { align-items: flex-start; padding: 1rem; }
      .edge-card { padding: 1.25rem; }
      .modal-panel { padding: 1.25rem; }
    }
  </style>
</head>
